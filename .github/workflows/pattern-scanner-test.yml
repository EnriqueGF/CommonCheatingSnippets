name: Pattern scanner bounds test

on:
  push:
    paths:
      - "PatternScanner/**"
      - ".github/workflows/pattern-scanner-test.yml"
  pull_request:
    paths:
      - "PatternScanner/**"
      - ".github/workflows/pattern-scanner-test.yml"

jobs:
  bounds-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build regression test
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc PatternScanner\PatternBoundsTest.cpp /Fe:PatternBoundsTest.exe
      - name: Run regression test
        shell: cmd
        run: PatternBoundsTest.exe
